  <script>
    const TG_LINK = "https://t.me/your_telegram_channel"; 
    const KUNAL_LINK = "https://t.me/your_kunal_link";

    function openTelegramWithLead(){
      try{
        if(typeof fbq === "function"){
          fbq('track', 'Lead'); 
        }
      }catch(e){}

      window.open(TG_LINK, "_blank");
    }

    function openKunalLinkWithLead(){
      try{
        if(typeof fbq === "function"){
          fbq('track', 'Lead'); 
        }
      }catch(e){}

      window.open(KUNAL_LINK, "_blank");
    }

    const joinBtn = document.getElementById("joinBtn");
    joinBtn.addEventListener("click", function(){
      openTelegramWithLead();
    });

    const kunalAdsBtn = document.getElementById("kunalAdsBtn");
    kunalAdsBtn.addEventListener("click", function(){
      openKunalLinkWithLead();
    });

    let timeLeft = 10;
    const timerEl = document.getElementById("timer");

    const interval = setInterval(() => {
      timeLeft--;
      if(timerEl) {
        timerEl.textContent = timeLeft;
      }

      if(timeLeft <= 0){
        clearInterval(interval);
        openTelegramWithLead();
      }
    }, 1000);
  </script>
